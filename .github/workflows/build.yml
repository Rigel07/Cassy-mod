name: Build Cassy Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x ./gradlew

    - name: Compilar el mod con Gradle
      run: ./gradlew build

    - name: Subir el archivo JAR (Artefacto)
      uses: actions/upload-artifact@v4
      with:
        name: CassyMod-1.20.1-JAR
        path: build/libs/*.jar
